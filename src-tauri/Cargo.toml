[package]
name = "ce-tiaozhuan"
version = "0.1.0"
description = "测跳转 - URL 重定向链路追踪工具"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["stream", "socks", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
