[package]
name = "ce-tiaozhuan"
version = "1.3.7"
description = "测跳转 - URL 重定向链路追踪工具"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["stream", "socks", "cookies", "gzip", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"

[profile.release]
strip = true        # 去除符号信息，大幅减小体积
lto = true          # Link-Time Optimization，跨 crate 优化
codegen-units = 1   # 单编译单元，更好的优化（编译变慢，体积更小）
opt-level = "s"     # 优化体积而非速度（"z" 更激进但可能影响性能）
